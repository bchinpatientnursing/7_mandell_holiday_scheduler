<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>7 Mandell Holiday Scheduler</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

  <main class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden text-center p-8 space-y-6">
    
    <!-- Lock Icon Badge -->
    <div class="mx-auto w-16 h-16 rounded-full bg-slate-100 flex items-center justify-center border border-slate-200 shadow-inner">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>

    <!-- Main Announcement -->
    <div class="space-y-3">
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">7 Mandell Holiday Scheduler</h1>
      <div class="h-0.5 w-12 bg-slate-200 mx-auto rounded-full"></div>
      <p class="text-base font-semibold text-slate-700 leading-relaxed pt-2">
        The 7 Mandell Holiday Schedule Selection period is now closed.
      </p>
      <p class="text-sm text-slate-500 leading-normal">
        Updates will be shared via leadership and UKG.
      </p>
    </div>

    <!-- Status Footer -->
    <div class="pt-4 border-t border-slate-100">
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600">
        <span class="w-2 h-2 rounded-full bg-slate-400"></span>
        Access Window Locked
      </span>
    </div>

  </main>

</body>
</html>
